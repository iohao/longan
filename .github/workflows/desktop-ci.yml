name: Desktop CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: desktop-bundle-macos
          - os: windows-latest
            label: Windows
            artifact_name: desktop-bundle-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Check frontend types
        run: bun run typecheck

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Disable Spotlight indexing on macOS
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Build desktop bundles
        shell: bash
        run: |
          build_args=(--ci --verbose --no-sign)
          if [ "$RUNNER_OS" != "macOS" ]; then
            bun run desktop -- build "${build_args[@]}"
          else
            max_attempts=3
            attempt=1
            until bun run desktop -- build "${build_args[@]}"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Tauri build failed after $max_attempts attempts." >&2
                exit 1
              fi
              echo "Tauri build failed on attempt $attempt. Cleaning lingering DMG mounts and retrying..." >&2
              hdiutil info 2>/dev/null | grep -o '/dev/disk[0-9]*' | while read -r d; do
                hdiutil detach "$d" -force 2>/dev/null || true
              done
              rm -f src-tauri/target/release/bundle/dmg/rw.*.dmg 2>/dev/null || true
              sleep 5
              attempt=$((attempt + 1))
            done
          fi

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
